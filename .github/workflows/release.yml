name: Release GitHub Action

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: action-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 10.17.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/check-public-release-version.mjs
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: node scripts/check-production-licenses.mjs
      - run: pnpm check
      - name: Create source archive and SBOM
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="linguaflow-action-$version/" \
            --output="linguaflow-action-$version.tar.gz" "$GITHUB_SHA"
          node scripts/generate-sbom.mjs --output linguaflow-action.cdx.json
      - name: Attest Action archive provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: linguaflow-action-*.tar.gz
      - name: Attest Action SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: linguaflow-action-*.tar.gz
          sbom-path: linguaflow-action.cdx.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" linguaflow-action-*.tar.gz
          linguaflow-action.cdx.json --verify-tag --generate-notes
          --title "LinguaFlow Action ${GITHUB_REF_NAME#v}"
      - name: Move the supported major tag
        shell: bash
        run: |
          major="v${GITHUB_REF_NAME#v}"
          major="${major%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force "$major" "$GITHUB_SHA"
          git push origin "refs/tags/$major" --force
